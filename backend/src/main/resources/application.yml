spring:
  application:
    name: lunch-order-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  flyway:
    enabled: false
    baseline-on-migrate: true
    clean-disabled: true


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always


security:
  password:
    pepper: ${PASSWORD_PEPPER_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
