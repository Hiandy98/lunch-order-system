services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: lunch-order-backend
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - .env
      - ./backend/.env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./backend:/app
      - /app/target
    networks:
      - lunch-network
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: lunch-order-database
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
    ports:
      - "${DB_PORT}:5432"
    networks:
      - lunch-network
    volumes:
      - pgdata:/var/lib/postgresql/data


networks:
  lunch-network:
    driver: bridge


volumes:
  pgdata: